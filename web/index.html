<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Subnet Traffic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-identity">
    <h1 class="header-title">Subnet Traffic</h1>
    <div class="subnet-field">
      <input class="subnet-input" id="subnet" type="text" spellcheck="false" autocomplete="off"
             placeholder="192.168.2.0/24" aria-label="Watched subnet"
             aria-describedby="subnet-error">
      <span class="subnet-error" id="subnet-error" role="alert" hidden></span>
    </div>
    <span class="tag" id="mock-tag" hidden>simulated data</span>
  </div>
  <div class="header-status">
    <span class="header-host" id="host-ip"></span>
    <span class="header-count" id="device-count">0 devices</span>
    <span class="connection" id="connection" data-state="connecting">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connection-label">connecting</span>
    </span>
    <button class="record-button" id="record" type="button" aria-pressed="false"
            aria-describedby="record-status">
      <span class="record-dot" aria-hidden="true"></span>
      <span id="record-label">Record</span>
    </button>
  </div>
</header>

<p class="banner" id="banner" role="status" hidden></p>

<div class="record-status" id="record-status" hidden>
  <span class="record-state" id="record-state" role="status"></span>
  <span class="record-file" id="record-file"></span>
  <span class="record-rows" id="record-rows"></span>
  <span class="record-note" id="record-note" role="status" hidden></span>
</div>

<p class="empty" id="empty-state">Waiting for traffic&hellip;</p>
<main class="rows" id="rows"></main>
<footer class="axis-row grid-row">
  <div class="axis-gutter"></div>
  <div class="axis" id="axis"></div>
</footer>

<script src="app.js"></script>
</body>
</html>
